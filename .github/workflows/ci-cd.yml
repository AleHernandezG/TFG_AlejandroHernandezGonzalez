name: CI / CD — Cookr

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── CI Frontend ─────────────────────────────────────────────────────────────
  ci-frontend:
    name: Lint & typecheck — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

  # ── CI Backend ───────────────────────────────────────────────────────────────
  ci-backend:
    name: Typecheck & tests — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint & typecheck
        run: npm run lint

      # mongodb-memory-server descarga un mongod real la primera vez.
      # Sin caché son ~80 MB en cada ejecución del CI.
      - name: Cache del binario de mongodb-memory-server
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Tests
        run: npm test
        env:
          JWT_SECRET: test-secret-solo-para-ci
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

  # ── E2E (Playwright) ─────────────────────────────────────────────────────────
  # A propósito NO está en el `needs` de deploy: los E2E son flaky por naturaleza
  # y un falso rojo no debe dejarte sin poder desplegar un hotfix. Si aguanta en
  # verde una temporada, se promueve añadiéndolo ahí.
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend

      - name: Cache del binario de mongodb-memory-server
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Cache de los navegadores de Playwright
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Tests E2E
        run: npx playwright test
        working-directory: frontend
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Deploy (solo push a main) ─────────────────────────────────────────────────
  deploy:
    name: Deploy → Vercel + Render
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy backend → Render (Deploy Hook)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "202" ] || exit 1
