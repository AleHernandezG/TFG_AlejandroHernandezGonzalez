name: CI / CD — Cookr

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── CI Frontend ─────────────────────────────────────────────────────────────
  ci-frontend:
    name: Lint & typecheck — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript (tsc --noEmit)
        run: npx tsc --noEmit

  # ── CI Backend ───────────────────────────────────────────────────────────────
  ci-backend:
    name: Typecheck — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: TypeScript (tsc --noEmit)
        run: npm run lint

  # ── Deploy (solo push a main) ─────────────────────────────────────────────────
  deploy:
    name: Deploy → Vercel + Render
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy frontend → Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy backend → Render (Deploy Hook)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || exit 1
