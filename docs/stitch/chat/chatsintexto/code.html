<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cookr IA Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e9e8e4",
                        "secondary-fixed": "#e4e2e1",
                        "surface": "#faf9f5",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#8dcdff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "background": "#faf9f5",
                        "surface-dim": "#dbdad6",
                        "surface-bright": "#faf9f5",
                        "on-secondary-container": "#656464",
                        "surface-container-low": "#f4f4f0",
                        "error": "#ba1a1a",
                        "on-background": "#1b1c1a",
                        "primary-fixed": "#ffddb7",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#1b1c1c",
                        "primary-container": "#e8a855",
                        "inverse-primary": "#fcba65",
                        "inverse-surface": "#2f312e",
                        "outline-variant": "#d5c4b2",
                        "on-secondary-fixed-variant": "#474747",
                        "secondary-fixed-dim": "#c8c6c6",
                        "secondary-container": "#e4e2e1",
                        "on-tertiary-fixed-variant": "#004b70",
                        "surface-variant": "#e3e2df",
                        "on-tertiary-container": "#004b6f",
                        "primary": "#855400",
                        "secondary": "#5f5e5e",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f2f1ed",
                        "surface-container-highest": "#e3e2df",
                        "on-primary-fixed-variant": "#653e00",
                        "on-primary-fixed": "#2a1700",
                        "on-surface": "#1b1c1a",
                        "outline": "#837566",
                        "on-tertiary-fixed": "#001e30",
                        "tertiary": "#136490",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#cae6ff",
                        "primary-fixed-dim": "#fcba65",
                        "on-primary-container": "#643e00",
                        "surface-tint": "#855400",
                        "tertiary-container": "#7abbec",
                        "surface-container": "#efeeea",
                        "on-surface-variant": "#514538"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-full flex flex-col antialiased">
<!-- HEADER (TopAppBar Style JSON) -->
<header class="fixed top-0 w-full flex justify-between items-center px-6 py-4 bg-[#faf9f5]/80 backdrop-blur-xl z-50 shadow-[0px_12px_32px_rgba(27,28,26,0.06)]">
<button class="text-[#1b1c1a] hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-xl font-bold tracking-widest text-[#1b1c1a]">Cookr IA</h1>
<span class="text-xs text-secondary font-medium mt-0.5 tracking-wide uppercase">Asistente culinario</span>
<button class="mt-2 flex items-center gap-1 px-3 py-1 bg-surface-container-low rounded-full text-xs font-semibold text-secondary hover:bg-surface-variant transition-colors">
                Ver historial de chats
                <span class="material-symbols-outlined text-[14px]" data-icon="expand_more">expand_more</span>
</button>
</div>
<button class="text-[#1b1c1a] hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- MAIN CONTENT AREA (Empty State) -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pt-24 pb-32">
<div class="flex flex-col items-center max-w-md w-full text-center space-y-8">
<!-- Icon -->
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary shadow-[0px_12px_32px_rgba(27,28,26,0.06)]">
<span class="material-symbols-outlined text-3xl" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<!-- Typography -->
<h2 class="text-display-md font-bold tracking-[0.02em] leading-tight text-on-background">
                ¿En qué te puedo <br/>
<span class="text-primary italic">ayudar?</span>
</h2>
<!-- Suggested Chips -->
<div class="flex flex-col gap-3 w-full max-w-xs mx-auto mt-8">
<button class="px-5 py-3.5 bg-surface-container-low hover:bg-surface-container-highest transition-colors rounded-xl text-left flex items-center gap-3 active:scale-[0.98] duration-200">
<span class="material-symbols-outlined text-secondary" data-icon="restaurant_menu">restaurant_menu</span>
<span class="text-sm font-semibold text-on-background">¿Qué cocino hoy?</span>
</button>
<button class="px-5 py-3.5 bg-surface-container-low hover:bg-surface-container-highest transition-colors rounded-xl text-left flex items-center gap-3 active:scale-[0.98] duration-200">
<span class="material-symbols-outlined text-secondary" data-icon="kitchen">kitchen</span>
<span class="text-sm font-semibold text-on-background">Receta con lo que tengo</span>
</button>
<button class="px-5 py-3.5 bg-surface-container-low hover:bg-surface-container-highest transition-colors rounded-xl text-left flex items-center gap-3 active:scale-[0.98] duration-200">
<span class="material-symbols-outlined text-secondary" data-icon="no_meals">no_meals</span>
<span class="text-sm font-semibold text-on-background">Dieta sin gluten</span>
</button>
</div>
</div>
</main>
<!-- INPUT BAR (Fixed Bottom) -->
<div class="fixed bottom-0 w-full px-4 py-4 pb-8 bg-surface-container-lowest/80 backdrop-blur-[12px] shadow-[0px_-12px_32px_rgba(27,28,26,0.04)] z-40">
<div class="max-w-md mx-auto flex items-center gap-3">
<button class="p-2 text-secondary hover:text-on-background transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
</button>
<div class="flex-1 bg-surface-container-highest rounded-full flex items-center px-4 py-3">
<input class="w-full bg-transparent border-none outline-none text-on-background placeholder:text-secondary text-sm font-medium focus:ring-0 p-0" placeholder="¿En qué estás pensando?" type="text"/>
</div>
<button class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-primary-container flex items-center justify-center text-on-primary shadow-[0px_8px_16px_rgba(133,84,0,0.2)] hover:opacity-90 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
</div>
</body></html>
