<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cookr IA Chat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#136490",
                        "surface-container": "#efeeea",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dbdad6",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#8dcdff",
                        "outline-variant": "#d5c4b2",
                        "surface-variant": "#e3e2df",
                        "on-secondary-fixed-variant": "#474747",
                        "on-background": "#1b1c1a",
                        "secondary-container": "#e4e2e1",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#e8a855",
                        "surface": "#faf9f5",
                        "on-primary-fixed-variant": "#653e00",
                        "on-primary-container": "#643e00",
                        "on-secondary-container": "#656464",
                        "inverse-surface": "#2f312e",
                        "on-tertiary-fixed": "#001e30",
                        "surface-container-low": "#f4f4f0",
                        "tertiary-container": "#7abbec",
                        "inverse-on-surface": "#f2f1ed",
                        "on-tertiary-container": "#004b6f",
                        "primary-fixed-dim": "#fcba65",
                        "tertiary-fixed": "#cae6ff",
                        "on-error": "#ffffff",
                        "surface-container-high": "#e9e8e4",
                        "secondary-fixed-dim": "#c8c6c6",
                        "on-surface": "#1b1c1a",
                        "on-primary": "#ffffff",
                        "surface-tint": "#855400",
                        "primary": "#855400",
                        "error": "#ba1a1a",
                        "primary-fixed": "#ffddb7",
                        "surface-container-highest": "#e3e2df",
                        "on-surface-variant": "#514538",
                        "background": "#faf9f5",
                        "secondary-fixed": "#e4e2e1",
                        "surface-bright": "#faf9f5",
                        "on-primary-fixed": "#2a1700",
                        "secondary": "#5f5e5e",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-tertiary-fixed-variant": "#004b70",
                        "outline": "#837566",
                        "inverse-primary": "#fcba65"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar JSON Component -->
<header class="bg-[#faf9f5]/80 dark:bg-[#1b1c1a]/80 backdrop-blur-xl docked full-width top-0 sticky shadow-[0px_12px_32px_rgba(27,28,26,0.06)] z-50">
<div class="flex flex-col items-center justify-between px-6 py-4 w-full border-b border-outline-variant/15">
<div class="flex items-center justify-between w-full">
<button class="text-[#855400] dark:text-[#e8a855] hover:bg-[#f4f4f0] dark:hover:bg-[#252623] transition-colors duration-200 active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-xl font-extrabold text-[#1b1c1a] dark:text-[#faf9f5] tracking-[0.02em]">Cookr IA</h1>
<span class="text-xs font-semibold text-secondary tracking-widest uppercase mt-0.5">Asistente Culinario</span>
</div>
<button class="text-[#855400] dark:text-[#e8a855] hover:bg-[#f4f4f0] dark:hover:bg-[#252623] transition-colors duration-200 active:scale-95 font-semibold text-sm px-3 py-1.5 rounded-full">
                    History
                </button>
</div>
<button class="mt-4 bg-surface-container-low text-primary font-medium text-sm px-4 py-1.5 rounded-full hover:bg-surface-container transition-colors duration-200 flex items-center gap-1.5 active:scale-95">
<span class="material-symbols-outlined text-[18px]">history</span>
                Ver historial de chats
            </button>
</div>
</header>
<!-- Chat Canvas -->
<main class="flex-grow flex flex-col p-4 md:p-6 overflow-y-auto pb-24 md:pb-32 max-w-3xl mx-auto w-full gap-6">
<!-- Date Divider -->
<div class="flex items-center justify-center w-full my-2">
<span class="bg-surface-container-low text-secondary text-xs font-medium px-3 py-1 rounded-full">Hoy</span>
</div>
<!-- User Message -->
<div class="flex justify-end w-full">
<div class="bg-primary text-on-primary rounded-2xl rounded-tr-none px-5 py-3 max-w-[85%] shadow-sm">
<p class="text-sm md:text-base leading-relaxed">
                    Hola! Tengo tomates, cebolla y pasta. ¿Qué puedo cocinar?
                </p>
</div>
</div>
<!-- AI Message -->
<div class="flex justify-start w-full gap-3">
<div class="flex-shrink-0 mt-auto hidden sm:block">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-[18px]">restaurant</span>
</div>
</div>
<div class="flex flex-col items-start max-w-[90%] sm:max-w-[80%]">
<div class="bg-surface-container-lowest text-on-background border border-outline-variant/15 rounded-2xl rounded-tl-none px-5 py-4 shadow-[0px_4px_12px_rgba(27,28,26,0.03)]">
<p class="text-sm md:text-base leading-relaxed text-on-surface">
                        ¡Hola! Con esos ingredientes puedes preparar una deliciosa <span class="font-bold text-primary">Pasta Pomodoro Rústica</span>. Es un plato clásico, rápido y lleno de sabor. ¿Te gustaría que te guíe paso a paso?
                    </p>
</div>
<!-- AI Action Row -->
<div class="flex items-center gap-2 mt-2 px-1">
<button class="text-secondary hover:text-primary hover:bg-surface-container-low transition-colors duration-200 text-xs font-medium px-2.5 py-1.5 rounded-full flex items-center gap-1 active:scale-95">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
                        Copiar
                    </button>
<button class="text-secondary hover:text-primary hover:bg-surface-container-low transition-colors duration-200 text-xs font-medium px-2.5 py-1.5 rounded-full flex items-center gap-1 active:scale-95">
<span class="material-symbols-outlined text-[16px]">thumb_up</span>
                        Me gusta
                    </button>
</div>
</div>
</div>
</main>
<!-- Fixed Input Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-outline-variant/15 p-4 z-40">
<div class="max-w-3xl mx-auto w-full relative">
<div class="flex items-end gap-2 bg-surface-container-lowest border border-outline-variant/30 rounded-[1.5rem] p-2 shadow-[0px_-4px_16px_rgba(27,28,26,0.02)] focus-within:border-primary/50 transition-colors duration-200">
<button class="p-2 text-secondary hover:text-primary transition-colors flex-shrink-0 self-end mb-0.5 rounded-full hover:bg-surface-container-low active:scale-95">
<span class="material-symbols-outlined">attach_file</span>
</button>
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 px-2 text-sm text-on-background placeholder:text-on-surface-variant/60 max-h-32 min-h-[44px]" placeholder="¿En qué estás pensando?" rows="1"></textarea>
<button class="bg-primary hover:bg-primary/90 text-on-primary w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 self-end transition-transform active:scale-95 shadow-sm bg-gradient-to-br from-primary to-primary-container">
<span class="material-symbols-outlined icon-fill text-[20px]">send</span>
</button>
</div>
</div>
</div>
</body></html>
